<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thêm sản phẩm — Quản trị NôngViệt</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="../design.css" rel="stylesheet"><script src="../layout.js"></script><script src="admin.js"></script>
</head>
<body class="bg-base-200 min-h-screen" data-active="products" data-title="Thêm sản phẩm">
<div id="page">
<div class="max-w-5xl mx-auto space-y-4">
  <div><a href="products.html" class="text-sm link link-primary">← Danh sách sản phẩm</a>
    <h1 class="text-2xl font-bold" id="h1">Thêm sản phẩm</h1></div>

  <form class="grid lg:grid-cols-[1fr_20rem] gap-4" onsubmit="return save(event)" novalidate>
    <div class="space-y-4">
      <section class="card bg-base-100 border border-base-300 p-5 space-y-4">
        <h2 class="font-semibold">Thông tin cơ bản</h2>
        <label class="form-control w-full"><div class="label"><span class="label-text">Tên sản phẩm <span class="text-error">*</span></span></div>
          <input id="name" class="input w-full" placeholder="VD: Phân bón NPK 20-20-15 (bao 5kg)" required>
          <div class="label hidden" id="e-name"><span class="label-text-alt text-error">Vui lòng nhập tên sản phẩm</span></div></label>
        <label class="form-control w-full"><div class="label"><span class="label-text">Mô tả</span></div>
          <textarea id="desc" class="textarea w-full" rows="4" placeholder="Công dụng, thành phần, hướng dẫn sử dụng…"></textarea></label>
        <div class="grid sm:grid-cols-3 gap-3">
          <label class="form-control"><div class="label"><span class="label-text">Giá bán (₫) <span class="text-error">*</span></span></div>
            <input id="price" type="number" min="0" step="1000" class="input w-full" placeholder="185000">
            <div class="label hidden" id="e-price"><span class="label-text-alt text-error">Giá phải lớn hơn 0</span></div></label>
          <label class="form-control"><div class="label"><span class="label-text">Tồn kho <span class="text-error">*</span></span></div>
            <input id="stock" type="number" min="0" class="input w-full" placeholder="0">
            <div class="label hidden" id="e-stock"><span class="label-text-alt text-error">Tồn kho không được âm</span></div></label>
          <label class="form-control"><div class="label"><span class="label-text">Danh mục <span class="text-error">*</span></span></div>
            <select id="cat" class="select w-full"><option value="">Chọn danh mục…</option></select>
            <div class="label hidden" id="e-cat"><span class="label-text-alt text-error">Vui lòng chọn danh mục</span></div></label>
        </div>
      </section>

      <!-- Upload / quan ly anh san pham -->
      <section class="card bg-base-100 border border-base-300 p-5 space-y-3">
        <div class="flex items-center justify-between"><h2 class="font-semibold">Hình ảnh sản phẩm</h2><span class="text-xs text-base-content/50">Tối đa 5 ảnh · JPG/PNG · ≤ 2MB mỗi ảnh</span></div>
        <label class="flex flex-col items-center justify-center gap-1 border-2 border-dashed border-base-300 rounded-box p-8 cursor-pointer hover:border-primary hover:bg-primary/5 text-sm text-base-content/60">
          <span class="text-3xl">⬆️</span><span><b class="text-primary">Chọn ảnh</b> hoặc kéo thả vào đây</span>
          <input id="file" type="file" accept="image/*" multiple class="hidden"></label>
        <div id="imgs" class="grid grid-cols-3 sm:grid-cols-5 gap-3"></div>
      </section>
    </div>

    <aside class="space-y-4">
      <section class="card bg-base-100 border border-base-300 p-5">
        <h2 class="font-semibold mb-3">Xem trước trên cửa hàng</h2>
        <div class="card bg-base-100 border border-base-300">
          <div class="ph h-36 rounded-t-[var(--radius-box)]" id="pv-img">🌾</div>
          <div class="p-4 space-y-1"><div class="text-xs text-base-content/60" id="pv-cat">Danh mục</div>
            <div class="font-semibold leading-snug" id="pv-name">Tên sản phẩm</div>
            <div class="text-lg font-bold text-primary" id="pv-price">0₫</div>
            <div class="text-xs" id="pv-stock"></div></div>
        </div>
      </section>
      <section class="card bg-base-100 border border-base-300 p-5 space-y-2">
        <button class="btn btn-primary btn-block">Lưu sản phẩm</button>
        <a href="products.html" class="btn btn-ghost btn-block">Huỷ</a>
        <button type="button" id="del" class="btn btn-outline btn-error btn-block hidden" onclick="delP()">Xoá sản phẩm</button>
      </section>
    </aside>
  </form>
</div>
</div>
<script>
const $ = id => document.getElementById(id), id = +new URLSearchParams(location.search).get('id');
const P = PRODUCTS.find(p => p.id === id);
$('cat').innerHTML += CATEGORIES.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
let imgs = [];
if (P) {
  document.title = 'Sửa sản phẩm — Quản trị NôngViệt'; $('h1').textContent = 'Sửa sản phẩm #' + P.id; $('del').classList.remove('hidden');
  $('name').value = P.name; $('desc').value = 'Mô tả chi tiết của ' + P.name + '.'; $('price').value = P.price; $('stock').value = P.stock; $('cat').value = P.cat;
  imgs = [{ emoji: P.icon, name: 'anh-chinh.jpg' }];
}
function renderImgs() {
  $('imgs').innerHTML = imgs.map((m, i) => `
    <div class="relative group"><div class="ph ph-sm aspect-square rounded-field ${i === 0 ? 'ring-2 ring-primary' : ''}">${m.emoji || '🖼️'}</div>
      ${i === 0 ? '<span class="badge badge-primary badge-xs absolute bottom-1 left-1">Ảnh chính</span>' : `<button type="button" class="badge badge-neutral badge-xs absolute bottom-1 left-1" onclick="mainImg(${i})">Đặt làm chính</button>`}
      <button type="button" class="btn btn-circle btn-xs btn-error absolute -top-2 -right-2" aria-label="Xoá ảnh" onclick="rmImg(${i})">✕</button></div>`).join('');
}
function mainImg(i) { imgs.unshift(imgs.splice(i, 1)[0]); renderImgs(); preview(); }
function rmImg(i) { imgs.splice(i, 1); renderImgs(); preview(); }
$('file').addEventListener('change', e => { [...e.target.files].slice(0, 5 - imgs.length).forEach(f => imgs.push({ emoji: '🖼️', name: f.name })); renderImgs(); preview(); });
function preview() {
  $('pv-img').textContent = (imgs[0] && imgs[0].emoji) || '🌾';
  $('pv-name').textContent = $('name').value || 'Tên sản phẩm';
  $('pv-cat').textContent = catName(+$('cat').value) || 'Danh mục';
  $('pv-price').textContent = fmt(+$('price').value || 0);
  const s = $('stock').value; $('pv-stock').innerHTML = s === '' ? '' : +s === 0 ? '<span class="badge badge-neutral badge-sm">Hết hàng</span>' : +s <= 5 ? `<span class="badge badge-warning badge-sm">Chỉ còn ${s}</span>` : '<span class="text-success">● Còn hàng</span>';
}
['name', 'price', 'stock', 'cat'].forEach(k => $(k).addEventListener('input', preview));
function save(e) {
  e.preventDefault();
  const bad = { name: !$('name').value.trim(), price: !(+$('price').value > 0), stock: $('stock').value === '' || +$('stock').value < 0, cat: !$('cat').value };
  Object.entries(bad).forEach(([k, v]) => { $('e-' + k).classList.toggle('hidden', !v); $(k).classList.toggle('input-error', v); });
  if (Object.values(bad).some(Boolean)) { toast('Vui lòng kiểm tra lại các trường báo lỗi', 'error'); return false; }
  toast(P ? 'Đã cập nhật sản phẩm' : 'Đã thêm sản phẩm'); setTimeout(() => location.href = 'products.html', 900); return false;
}
function delP() { confirmBox({ title: 'Xoá sản phẩm?', message: `Xoá <b>${esc(P.name)}</b>? Không thể hoàn tác.`, okText: 'Xoá', okClass: 'btn-error', onOk() { toast('Đã xoá sản phẩm'); setTimeout(() => location.href = 'products.html', 900); } }); }
renderImgs(); preview();
</script>
</body>
</html>
