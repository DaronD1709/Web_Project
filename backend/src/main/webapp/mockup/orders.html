<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đơn hàng của tôi — Nông Việt</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="design.css" rel="stylesheet"><script src="layout.js"></script>
</head>
<body class="bg-base-200 min-h-screen" data-auth="user" data-active="orders">
<div id="site-header"></div>

<main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-[15rem_minmax(0,1fr)] gap-6">
  <aside><div id="account-nav"></div></aside>

  <section>
    <h1 class="text-2xl font-bold mb-4">Đơn hàng của tôi</h1>
    <div role="tablist" class="tabs tabs-border overflow-x-auto bg-base-100 rounded-box border border-base-300 px-2 mb-4" id="tabs"></div>
    <div class="space-y-4" id="list"></div>
  </section>
</main>

<div id="site-footer"></div>
<script>
  // status: khop OrderStatus trong entity (PENDING, CONFIRMED, SHIPPING, COMPLETED, CANCELLED, RETURN_REQUESTED, RETURNED)
  const ST = {
    pending: ['Chờ xác nhận', 'badge-warning'], confirmed: ['Đã xác nhận', 'badge-info'], shipping: ['Đang giao', 'badge-info'],
    completed: ['Hoàn tất', 'badge-success'], cancelled: ['Đã huỷ', 'badge-neutral'], return: ['Yêu cầu hoàn hàng', 'badge-error'],
  };
  const ORDERS = [
    { no: 1042, date: '02/10/2026', status: 'pending', items: [5, 3, 9], total: 1719000 },
    { no: 1038, date: '28/09/2026', status: 'shipping', items: [6], total: 250000 },
    { no: 1031, date: '20/09/2026', status: 'completed', items: [1, 2], total: 55000 },
    { no: 1027, date: '15/09/2026', status: 'return', items: [8], total: 3200000 },
    { no: 1019, date: '02/09/2026', status: 'cancelled', items: [7], total: 165000 },
  ];
  const tabs = [['all', 'Tất cả'], ['pending', 'Chờ xác nhận'], ['shipping', 'Đang giao'], ['completed', 'Hoàn tất'], ['cancelled', 'Đã huỷ'], ['return', 'Hoàn hàng']];
  let cur = 'all';
  function draw() {
    document.getElementById('tabs').innerHTML = tabs.map(([k, t]) =>
      `<a role="tab" class="tab ${k === cur ? 'tab-active' : ''}" onclick="cur='${k}';draw()">${t}</a>`).join('');
    const l = ORDERS.filter(o => cur === 'all' || o.status === cur || (cur === 'pending' && o.status === 'confirmed'));
    document.getElementById('list').innerHTML = l.length ? l.map(o => `
      <div class="card bg-base-100 border border-base-300">
        <div class="flex items-center justify-between px-5 py-3 border-b border-base-300 text-sm">
          <div><b class="font-mono">#${o.no}</b> <span class="text-base-content/60">· ${o.date}</span></div>
          <span class="badge ${ST[o.status][1]}">${ST[o.status][0]}</span>
        </div>
        <div class="px-5 py-3 space-y-2">
          ${o.items.map(id => { const p = PRODUCTS.find(x => x.id === id); return `<div class="flex items-center gap-3 text-sm"><div class="ph ph-sm size-12 rounded-field">${p.icon}</div><div class="flex-1">${p.name}</div><div class="text-base-content/60">×1</div></div>`; }).join('')}
        </div>
        <div class="flex flex-wrap items-center justify-between gap-2 px-5 py-3 border-t border-base-300">
          <div class="text-sm">Tổng tiền: <b class="text-primary text-lg">${fmt(o.total)}</b></div>
          <div class="flex gap-2">
            ${o.status === 'pending' ? '<button class="btn btn-sm btn-outline btn-error">Huỷ đơn</button>' : ''}
            ${o.status === 'completed' || o.status === 'cancelled' ? '<button class="btn btn-sm btn-outline">Mua lại</button>' : ''}
            <a href="order-detail.html?status=${o.status}" class="btn btn-sm btn-primary">Xem chi tiết</a>
          </div>
        </div>
      </div>`).join('') : `<div class="card bg-base-100 border border-dashed border-base-300 p-12 text-center"><div class="text-5xl">📦</div><div class="mt-2 font-semibold">Chưa có đơn hàng nào</div></div>`;
  }
  draw();
</script>
</body>
</html>
